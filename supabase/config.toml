# Los triggers de la DB llaman a send-push con pg_net usando SOLO el header
# x-internal-secret (sin JWT de Supabase). Si verify_jwt queda en true, el
# gateway rechaza la llamada con 401 antes de ejecutar la función y el push
# nunca sale. La función valida el secreto interno por su cuenta.
[functions.send-push]
verify_jwt = false

# Mints LiveKit participant JWT. verify_jwt=true so the function receives the
# caller's Supabase JWT; the participant identity is derived from its subject.
[functions.livekit-token]
verify_jwt = true

# VCDN delete: called from Android (JWT) and from the expiration crons
# via pg_net with x-internal-secret (same contract as send-push); without this,
# the gateway rejects the cron call with 401 before the function can validate
# the internal secret.
[functions.vcdn-delete]
verify_jwt = false
