name: security-scan

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear diff por secretos de alto riesgo
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          git fetch origin "$BASE" --quiet 2>/dev/null || BASE="HEAD~1"
          echo "Escaneando el diff entre $BASE y HEAD..."

          # Patrones de alto riesgo: si un PR incluye cualquiera, se bloquea.

          DETECTADOS=$(
            git diff "$BASE...HEAD" 2>/dev/null \
            | grep -E '^\+' \
            | grep -nE \
                -e 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}' \
                -e 'sk_live_[A-Za-z0-9]{10,}' \
                -e 'AKIA[0-9A-Z]{16}' \
                -e '(ghp_|github_pat_|gho_|ghu_)[A-Za-z0-9]{20,}' \
                -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
                -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
                -e 'service_role_key[[:space:]]*=[[:space:]]]*["'"'"'][A-Za-z0-9._-]{20,}' \
                -e 'supabase[[:space:]]*[.][[:space:]]*service_role' \
                -e 'KEYSTORE_(PASSWORD|ALIAS)[[:space:]]*=[[:space:]]]*[^$[:space:]]{4,}' \
                -e 'GOOGLE_SERVICES_JSON[[:space:]]*(=|[a-zA-Z]*\.)[[:space:]]*["'"'"'][A-Za-z0-9]{10,}' \
          )
          if [ -n "$DETECTADOS" ]; then
            echo "::error::Se detectaron patrones de secretos en el diff. Bloqueando:"
            echo "$DETECTADOS" | head -30
            exit 1
          fi
          echo "✅ Sin patrones de secretos en el diff."

      - name: Comentar resultado en el PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const head = pr.head.sha;
            const state = (context.job.status === 'success') ? 'success' : 'failure';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'security-scan',
              head_sha: head,
              status: 'completed',
              conclusion: state === 'success' ? 'success' : 'failure',
              output: {
                title: state === 'success' ? 'Sin secretos detectados' : 'Posibles secretos en el diff',
                summary: state === 'success'
                  ? 'El escáner de secretos no encontró patrones de alto riesgo en el diff de este PR.'
                  : 'El escáner encontró patrones que parecen secretos. Revisá el log del job y eliminá cualquier credencial antes de mergear.',
              },
            });